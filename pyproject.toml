[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phpvci"
version = "2.1.0"
description = "PHP Modules Version Control Interface"
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
phpvci = "phpvci.cli:main"
